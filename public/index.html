<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Gotland Ferry Watch</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Gotland Ferry Watch</h1>
    <p class="subtitle">Bevakar en specifik avgång hos Destination Gotland och pingar Discord när en salong blir ledig.</p>

    <section class="card">
      <h2>Lägg till bevakning</h2>
      <form id="add-form">
        <label>Namn
          <input name="label" placeholder="t.ex. Söndag hem" required />
        </label>
        <div class="row">
          <label>Resväg
            <select name="route" id="route-select" required></select>
          </label>
          <label>Datum
            <input name="date" type="date" required />
          </label>
        </div>
        <div class="row">
          <label>Avgång (HH:MM)
            <input name="departureTime" placeholder="07:15" pattern="\d{2}:\d{2}" required />
          </label>
          <label>Antal vuxna
            <div class="stepper">
              <button type="button" class="step" data-target="adults" data-delta="-1" aria-label="Minska antal">−</button>
              <input name="adults" type="number" min="1" max="9" value="2" inputmode="numeric" required />
              <button type="button" class="step" data-target="adults" data-delta="1" aria-label="Öka antal">+</button>
            </div>
          </label>
          <label>Fordon
            <div class="stepper">
              <button type="button" class="step" data-target="vehicleCount" data-delta="-1" aria-label="Minska antal">−</button>
              <input name="vehicleCount" type="number" min="0" max="1" value="1" inputmode="numeric" required />
              <button type="button" class="step" data-target="vehicleCount" data-delta="1" aria-label="Öka antal">+</button>
            </div>
          </label>
          <label>Fordonstyp
            <select name="vehicleType" id="vehicle-select" required></select>
          </label>
        </div>
        <p class="hint">Avgångstiden måste matcha sajtens tabell exakt, t.ex. <code>07:15</code>.</p>
        <button type="submit">Lägg till</button>
        <span id="form-error" class="error"></span>
      </form>
    </section>

    <section class="card">
      <h2>Bevakade avgångar</h2>
      <table id="watch-table">
        <thead>
          <tr>
            <th>Namn</th>
            <th>Resa</th>
            <th>Status</th>
            <th>Lediga biljetter</th>
            <th>Senast kollad</th>
            <th>Aktiv</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
