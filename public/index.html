<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Gotland Ferry Watch</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Gotland Ferry Watch</h1>
    <p class="subtitle">Bevakar Destination Gotlands avgångar och pingar Discord när en plats blir ledig.</p>

    <section class="card">
      <h2>Lägg till bevakning</h2>
      <form id="add-form">
        <label>Namn
          <input name="label" placeholder="t.ex. Fredag hemresa" required />
        </label>
        <div class="row">
          <label>Från
            <input name="origin" placeholder="Nynäshamn" required />
          </label>
          <label>Till
            <input name="destination" placeholder="Visby" required />
          </label>
        </div>
        <div class="row">
          <label>Datum
            <input name="date" type="date" required />
          </label>
          <label>Tid (valfritt)
            <input name="time" type="time" />
          </label>
        </div>
        <label>Sökresultat-URL (rekommenderas)
          <input name="searchUrl" placeholder="Klistra in URL:en från en manuell sökning på destinationgotland.se" />
        </label>
        <button type="submit">Lägg till</button>
      </form>
    </section>

    <section class="card">
      <h2>Bevakade avgångar</h2>
      <table id="watch-table">
        <thead>
          <tr>
            <th>Namn</th>
            <th>Rutt</th>
            <th>Datum / tid</th>
            <th>Status</th>
            <th>Senast kollad</th>
            <th>Aktiv</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
